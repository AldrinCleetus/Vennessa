name: full_cold_restart
description: Everything restarts at once (e.g. after a bad deploy or LB failure), caches come back empty.
duration_s: 1800
warmup_s: 300
events:
  - {at_s: 600, action: restart, target: lb}
  - {at_s: 600, action: restart, target: redis}
  - {at_s: 600, action: restart, target: snowflake-service}
  - {at_s: 600, action: restart, target: user-management}
  - {at_s: 600, action: restart, target: jobber}
