# NIC customer portal: current architecture (first sketch).
#
# Every number marked ASSUMPTION is a placeholder. Replace it with real values
# (replica counts, warehouse size, peak rps, timeouts/retries from the code).
# The simulator is only as accurate as these numbers.

name: nic_current
description: NIC portal today. Auth0 login, User Management, Snowflake Service, jobber, Redis, Snowflake warehouse, Rev.io.

slo:
  error_rate_max: 0.01      # ASSUMPTION: 99% of requests succeed, per second
  p99_ms_max: 4000          # ASSUMPTION
  recover_within_s: 300

traffic:
  sources:
    - name: portal_users
      target: lb
      rps: 40               # ASSUMPTION: peak-hour portal API requests/sec
      timeout_ms: 30000     # browser/axios timeout
    - name: jobber_seed     # background Redis seeding jobs
      target: jobber
      rps: 1                # ASSUMPTION

nodes:
  - id: lb
    type: load_balancer
    replicas: 2             # ASSUMPTION
    concurrency_per_replica: 2000
    queue_per_replica: 1000
    latency_ms: {p50: 1, p99: 5}

  - id: snowflake-service
    type: service
    description: Reports, sites, Active Services, network metrics
    replicas: 3                     # ASSUMPTION
    concurrency_per_replica: 20     # ASSUMPTION: Node.js + snowflake-sdk connection pool size
    queue_per_replica: 100
    latency_ms: {p50: 20, p99: 120}
    startup:
      time_s: 25                    # ASSUMPTION
      requires: [redis]             # connects to Redis at boot
    health_check: {interval_s: 10, fail_threshold: 0.5, unhealthy_after: 3}

  - id: user-management
    type: service
    description: Users, roles, menus, branding, Auth0 management
    replicas: 2                     # ASSUMPTION
    concurrency_per_replica: 20
    queue_per_replica: 100
    latency_ms: {p50: 15, p99: 80}
    startup:
      time_s: 20
      requires: [redis, auth0]      # ASSUMPTION: loads Auth0 config at boot
    health_check: {interval_s: 10, fail_threshold: 0.5, unhealthy_after: 3, deep: true}  # ASSUMPTION

  - id: jobber
    type: service
    description: Background jobs; seeds Redis from Snowflake
    replicas: 1
    concurrency_per_replica: 4
    queue_per_replica: 50
    latency_ms: {p50: 50, p99: 300}
    startup: {time_s: 15, requires: [redis]}

  - id: redis
    type: cache
    replicas: 1                     # ASSUMPTION: single node
    concurrency_per_replica: 5000
    queue_per_replica: 5000
    latency_ms: {p50: 1, p99: 5}
    warm_hit_rate: 0.8              # ASSUMPTION: share of warehouse reads served from cache
    cold_hit_rate: 0.0
    warmup_s: 600                   # ASSUMPTION: time for the cache to fill back up
    startup: {time_s: 5}

  - id: snowflake-wh
    type: datastore
    description: Portal warehouse (WH_PORTAL_PROD)
    replicas: 1                     # ASSUMPTION: 1 cluster (no multi-cluster scaling)
    concurrency_per_replica: 8      # Snowflake default MAX_CONCURRENCY_LEVEL
    queue_per_replica: 200
    latency_ms: {p50: 400, p99: 2500}   # ASSUMPTION: typical portal query times
    startup: {time_s: 2}

  - id: auth0
    type: external
    rate_limit_rps: 15              # ASSUMPTION: check the Auth0 plan's Management API limit
    replicas: 1
    concurrency_per_replica: 1000
    queue_per_replica: 0
    latency_ms: {p50: 150, p99: 700}

  - id: revio
    type: external
    rate_limit_rps: 10              # ASSUMPTION
    replicas: 1
    concurrency_per_replica: 100
    queue_per_replica: 0
    latency_ms: {p50: 400, p99: 3000}

edges:
  - {from: lb, to: snowflake-service, weight: 0.7, timeout_ms: 60000}   # ASSUMPTION: traffic split
  - {from: lb, to: user-management,  weight: 0.3, timeout_ms: 60000}

  - from: snowflake-service
    to: snowflake-wh
    via_cache: redis
    timeout_ms: 30000               # ASSUMPTION: check snowflake-sdk timeout
    retry: {attempts: 3, backoff: none}   # ASSUMPTION: check the real retry config
    pool: 40

  - from: user-management
    to: auth0
    p: 0.2                          # ASSUMPTION: share of requests hitting the Auth0 Management API
    timeout_ms: 5000
    retry: {attempts: 2, backoff: exponential, base_ms: 200, jitter: true}
  - from: user-management
    to: revio
    p: 0.05                         # ASSUMPTION: billing calls
    timeout_ms: 10000
    required: false

  - {from: jobber, to: snowflake-wh, timeout_ms: 60000}
