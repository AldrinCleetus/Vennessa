# Portal B: PLACEHOLDER. We don't know this architecture yet.
# Replace with the real components, numbers, and traffic once we have them.

name: portal_b
description: Second portal (placeholder shape - replace with real architecture).

traffic:
  sources:
    - name: users
      target: lb
      rps: 30               # PLACEHOLDER

nodes:
  - id: lb
    type: load_balancer
    replicas: 2
    concurrency_per_replica: 2000
    queue_per_replica: 1000
    latency_ms: {p50: 1, p99: 5}

  - id: api
    type: service
    replicas: 3
    concurrency_per_replica: 30
    queue_per_replica: 100
    latency_ms: {p50: 25, p99: 150}
    startup: {time_s: 20, requires: [db]}
    health_check: {interval_s: 10, fail_threshold: 0.5, unhealthy_after: 3}

  - id: cache
    type: cache
    replicas: 1
    concurrency_per_replica: 5000
    queue_per_replica: 5000
    latency_ms: {p50: 1, p99: 5}
    warm_hit_rate: 0.7
    warmup_s: 300

  - id: db
    type: datastore
    replicas: 1
    concurrency_per_replica: 50
    queue_per_replica: 200
    latency_ms: {p50: 15, p99: 120}

  - id: auth0
    type: external
    rate_limit_rps: 15
    replicas: 1
    concurrency_per_replica: 1000
    queue_per_replica: 0
    latency_ms: {p50: 150, p99: 700}

edges:
  - {from: lb, to: api, timeout_ms: 60000}
  - {from: api, to: db, via_cache: cache, timeout_ms: 10000, retry: {attempts: 2, backoff: exponential, base_ms: 100, jitter: true}}
  - {from: api, to: auth0, p: 0.3, timeout_ms: 5000, retry: {attempts: 1, backoff: fixed, base_ms: 200}}
