# "Add a thing" example: NIC plus a new reporting service that reads the same
# Snowflake warehouse with no cache. Copy this pattern to try any addition.

name: nic_plus_reporting
description: NIC today + a new uncached reporting service on the shared warehouse.

include:
  - file: nic_current.yaml

traffic:
  sources:
    - {name: reporting_users, target: lb, rps: 4}     # ASSUMPTION

nodes:
  - id: reporting-service
    type: service
    replicas: 2
    concurrency_per_replica: 10
    queue_per_replica: 100
    latency_ms: {p50: 30, p99: 200}
    startup: {time_s: 20}
    health_check: {interval_s: 10, fail_threshold: 0.5, unhealthy_after: 3}

edges:
  - {from: lb, to: reporting-service, sources: [reporting_users], timeout_ms: 60000}
  - {from: reporting-service, to: snowflake-wh, timeout_ms: 30000, retry: {attempts: 2, backoff: exponential, base_ms: 500, jitter: true}}

override:
  edges:
    # existing routes only carry portal traffic
    - {from: lb, to: snowflake-service, set: {sources: [portal_users]}}
    - {from: lb, to: user-management,  set: {sources: [portal_users]}}
