# Merge option: both portals behind one load balancer, sharing one Auth0 tenant
# and one Redis. Nothing here is code; it's composed from the two architecture files.
# Copy this file and change `unify` to try other merge options.

name: nic_merged
description: NIC + Portal B behind a shared LB, shared Auth0 tenant, shared Redis.

include:
  - file: nic_current.yaml
  - file: portal_b.yaml
    prefix: b_            # every Portal B id becomes b_<id>

unify:                    # these Portal B components become the NIC ones
  b_lb: lb
  b_auth0: auth0
  b_cache: redis

override:
  edges:
    # host-based routing on the shared LB: each portal's users go to its own services
    - {from: lb, to: snowflake-service, set: {sources: [portal_users]}}
    - {from: lb, to: user-management,  set: {sources: [portal_users]}}
    - {from: lb, to: b_api,            set: {sources: [b_users]}}
